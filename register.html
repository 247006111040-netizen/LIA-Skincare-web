<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - LIAÉ Skincare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Pakai CSS yang sama dengan login kamu */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #ea6680, #c52c55); padding: 20px; }
        .brand { text-align: center; color: white; margin-bottom: 15px; }
        .card { width: 100%; max-width: 380px; padding: 30px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3); color: white; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: none; background: white; font-size: 14px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: linear-gradient(45deg, #667eea, #764ba2); color: white; }
        .extra { margin-top: 20px; font-size: 13px; }
        a { color: white; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="brand">
        <h2>LIAÉ Skincare</h2>
        <p>Mulai perjalanan cantikmu ✨</p>
    </div>
    <div class="card">
        <h1>Daftar Akun</h1>
        <div class="input-group"><input type="text" placeholder="Nama Lengkap"></div>
        <div class="input-group"><input type="email" placeholder="Email"></div>
        <div class="input-group"><input type="password" placeholder="Password"></div>
        <button class="btn">Daftar Sekarang</button>
        <div class="extra">Sudah punya akun? <a href="index.html">Login di sini</a></div>
    </div>
</body>
</html>
